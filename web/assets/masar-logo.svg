<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="masarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="masarBeam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="masarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base rounded container -->
  <rect width="64" height="64" rx="16" fill="url(#masarGrad)" />

  <!-- Background subtle grid / track circles representing trajectory / orbit -->
  <circle cx="32" cy="32" r="22" stroke="white" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="32" cy="32" r="14" stroke="white" stroke-opacity="0.12" stroke-width="1" />

  <!-- Trajectory / Masar (مسار) Path forming stylized 'M' with directional flow -->
  <!-- Left path ascending from (16,46) to (20,18) -->
  <path d="M 16 46 L 20 20 L 32 36 L 44 20 L 48 46" 
        stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- High-tech inner optical trajectory beam -->
  <path d="M 16 46 L 20 20 L 32 36 L 44 20 L 48 46" 
        stroke="url(#masarBeam)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#masarGlow)" />

  <!-- Quantum / Optical Waypoint Nodes along the path -->
  <circle cx="16" cy="46" r="3" fill="#38bdf8" stroke="white" stroke-width="1.5" />
  <circle cx="20" cy="20" r="3.5" fill="#38bdf8" stroke="white" stroke-width="1.5" />
  <circle cx="32" cy="36" r="4" fill="#34d399" stroke="white" stroke-width="2" />
  <circle cx="44" cy="20" r="3.5" fill="#38bdf8" stroke="white" stroke-width="1.5" />
  <circle cx="48" cy="46" r="3" fill="#34d399" stroke="white" stroke-width="1.5" />

  <!-- Center pulse dot -->
  <circle cx="32" cy="36" r="1.5" fill="white" />
</svg>
